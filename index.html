<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Seguimiento de Obra</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      /* 1. PALETA DE COLORES SOLICITADA */
      /* Fondo general de la página: Blanco Arena */
      --bg-sand: #F5F1E8;
      --bg-sand-gradient: radial-gradient(circle at 50% 0%, #FAF7F0 0%, #ECE6D8 100%);
      
      /* Contorno y marco posterior: Verde pastel oscuro */
      --green-dark-bg: #1F2D24;
      --green-frame-border: #3A4E40;
      --green-accent: #486551;
      --green-accent-hover: #557760;

      /* 3 Tonos Beige para los mensajes */
      --beige-tone-1: #FAF5EB; /* Fondo principal de la tarjeta */
      --beige-tone-2: #EFE3D0; /* Fondo de etiquetas, chips y zonas destacadas */
      --beige-tone-3: #DBC8B0; /* Bordes y divisores finos del mensaje */

      /* Textos con contraste ergonómico */
      --text-dark: #222923;
      --text-muted-dark: #636E65;
      --text-light: #F4EFE6;
      --danger-color: #B23B3B;
      --danger-bg: #FBEBEB;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: var(--bg-sand-gradient);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* BARRA SUPERIOR */
    .macos-menu-bar {
      height: 38px;
      background: rgba(31, 45, 36, 0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--green-frame-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-light);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-left, .menu-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .apple-icon {
      font-size: 15px;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(85, 119, 96, 0.3);
      border: 1px solid rgba(132, 175, 145, 0.4);
      color: #A3D4B1;
      font-size: 11px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #73C991;
      box-shadow: 0 0 6px #73C991;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* CONTENEDOR PRINCIPAL CON FONDO VERDE PASTEL OSCURO */
    .desktop-container {
      flex: 1;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .window-frame {
      width: 100%;
      max-width: 900px;
      background: var(--green-dark-bg);
      border: 1px solid var(--green-frame-border);
      border-radius: 18px;
      box-shadow: 0 20px 50px rgba(18, 28, 22, 0.35);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* BARRA DE TÍTULO (SIN LOS 3 PUNTOS Y SIN LA PALABRA CHANGELOG) */
    .window-header {
      height: 56px;
      background: rgba(0, 0, 0, 0.15);
      border-bottom: 1px solid var(--green-frame-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 22px;
    }

    .window-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-light);
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.3px;
    }

    .btn-action {
      background: var(--green-accent);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #FAF6EF;
      font-size: 12.5px;
      font-weight: 600;
      padding: 7px 14px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-action:hover {
      background: var(--green-accent-hover);
      transform: translateY(-1px);
    }

    /* ZONA DEL FEED */
    .window-body {
      padding: 24px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
    }

    .timeline {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* TARJETA DEL MENSAJE (3 TONOS BEIGE) */
    .timeline-card {
      background: var(--beige-tone-1); /* Tono 1 */
      border: 1px solid var(--beige-tone-3); /* Tono 3 */
      border-radius: 14px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .timeline-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.18);
    }

    .card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .card-tags {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .badge-version {
      background: var(--beige-tone-2); /* Tono 2 */
      color: var(--text-dark);
      border: 1px solid var(--beige-tone-3);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      font-family: monospace;
    }
    .badge-phase {
      background: rgba(72, 101, 81, 0.12);
      color: #2D4333;
      border: 1px solid rgba(72, 101, 81, 0.25);
      padding: 3px 9px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
    }

    .card-controls {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: auto;
    }

    .card-date {
      color: var(--text-muted-dark);
      font-size: 12px;
    }

    /* BOTÓN DE ELIMINAR */
    .btn-delete {
      background: var(--danger-bg);
      color: var(--danger-color);
      border: 1px solid rgba(178, 59, 59, 0.25);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }
    .btn-delete:hover {
      background: var(--danger-color);
      color: #ffffff;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--text-dark);
    }

    .card-desc {
      font-size: 14px;
      color: #38423A;
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 14px;
    }

    /* FOTOS SUBIDAS */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 10px;
    }
    .photo-thumb {
      width: 100%;
      height: 110px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid var(--beige-tone-3);
      transition: transform 0.2s;
    }
    .photo-thumb:hover {
      transform: scale(1.03);
    }

    /* MODAL PARA SUBIR INFORME CON DRAG & DROP */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 28, 22, 0.7);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      background: var(--green-dark-bg);
      border: 1px solid var(--green-frame-border);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
      color: var(--text-light);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }
    .modal-title {
      font-size: 16px;
      font-weight: 600;
    }
    .close-modal-btn {
      background: none;
      border: none;
      color: var(--text-light);
      font-size: 18px;
      cursor: pointer;
      opacity: 0.7;
    }
    .close-modal-btn:hover { opacity: 1; }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: #A3B5A7;
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-input, .form-textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid var(--green-frame-border);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: #FAF5EB;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: #72967C;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ZONA DRAG & DROP PARA SUBIR FOTOS */
    .dropzone {
      border: 2px dashed #4E6855;
      border-radius: 10px;
      padding: 20px;
      text-align: center;
      background: rgba(0, 0, 0, 0.15);
      cursor: pointer;
      transition: all 0.2s;
    }
    .dropzone.dragover {
      border-color: #8EB99B;
      background: rgba(72, 101, 81, 0.25);
    }
    .dropzone-text {
      font-size: 13px;
      color: #D3E0D6;
    }
    .dropzone-hint {
      font-size: 11px;
      color: #8C9F91;
      margin-top: 4px;
    }

    .preview-container {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    .preview-thumb-wrap {
      position: relative;
      width: 60px;
      height: 60px;
    }
    .preview-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 6px;
      border: 1px solid var(--green-frame-border);
    }
    .remove-thumb {
      position: absolute;
      top: -5px;
      right: -5px;
      background: var(--danger-color);
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px;
      height: 18px;
      font-size: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* LIGHTBOX VISOR */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      cursor: zoom-out;
    }
    .lightbox.open { display: flex; }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR -->
  <div class="macos-menu-bar">
    <div class="menu-left">
      <span class="apple-icon"></span>
      <span>Portal Obra</span>
    </div>
    <div class="menu-right">
      <div class="status-badge">
        <span class="pulse-dot"></span>
        <span>En Vivo</span>
      </div>
      <span id="clock-display">12:00 PM</span>
    </div>
  </div>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="desktop-container">
    <div class="window-frame">
      <div class="window-header">
        <div class="window-title">
          <span>🏗️ Registro Diario de Obra</span>
        </div>
        <button class="btn-action" onclick="openReportModal()">+ Nuevo Informe</button>
      </div>

      <div class="window-body">
        <div class="timeline" id="changelog-feed">
          <div style="text-align: center; padding: 40px; color: #8A9E8F;">
            Cargando informes...
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL DE PUBLICACIÓN -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-header">
        <span class="modal-title">Publicar Informe Técnico</span>
        <button class="close-modal-btn" onclick="closeReportModal()">✕</button>
      </div>
      
      <div class="form-group">
        <label>Versión del Reporte</label>
        <input type="text" id="rep-version" class="form-input" placeholder="v1.0.4 o Día 15">
      </div>
      
      <div class="form-group">
        <label>Fase de Obra</label>
        <input type="text" id="rep-phase" class="form-input" placeholder="Cimentación, Estructura, Acabados...">
      </div>

      <div class="form-group">
        <label>Título o Resumen Breve</label>
        <input type="text" id="rep-title" class="form-input" placeholder="Avance de obra y fraguado...">
      </div>

      <div class="form-group">
        <label>Detalle Técnico de la Arquitecta</label>
        <textarea id="rep-desc" class="form-textarea" rows="4" placeholder="Escribe aquí las observaciones..."></textarea>
      </div>

      <!-- ZONA DE CARGA DE FOTOS POR ARRASTRE -->
      <div class="form-group">
        <label>Fotos y Evidencias de la Obra</label>
        <div class="dropzone" id="dropzone" onclick="document.getElementById('file-input').click()">
          <div class="dropzone-text">📷 Arrastra tus fotos aquí o haz clic para subir</div>
          <div class="dropzone-hint">Compatible con fotos tomadas desde celular o computadora</div>
        </div>
        <input type="file" id="file-input" multiple accept="image/*" style="display: none;">
        <div class="preview-container" id="preview-list"></div>
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
        <button class="btn-action" style="background: rgba(255,255,255,0.1);" onclick="closeReportModal()">Cancelar</button>
        <button class="btn-action" id="btn-save-report" onclick="submitReport()">Publicar al Instante</button>
      </div>
    </div>
  </div>

  <!-- LIGHTBOX -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Ampliación">
  </div>

  <script>
    const SUPABASE_URL = "https://euagegivizyfweymdiaa.supabase.co";
    const SUPABASE_ANON = "sb_publishable__O5ZZXX9L8Vp4JmAIT6vdQ_pUvVxaa5";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

    let uploadedImagesBase64 = [];

    // Reloj
    function updateClock() {
      const now = new Date();
      document.getElementById('clock-display').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Cargar y mostrar informes
    async function loadReports() {
      const feed = document.getElementById('changelog-feed');
      const { data, error } = await supabaseClient
        .from('changelog_updates')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        feed.innerHTML = `<div style="text-align:center; padding:30px; color:#ff9999;">Error al conectar: ${error.message}</div>`;
        return;
      }

      renderReports(data);
    }

    function renderReports(items) {
      const feed = document.getElementById('changelog-feed');
      if (!items || items.length === 0) {
        feed.innerHTML = `<div style="text-align:center; padding:40px; color:#A3B5A7;">No hay informes publicados todavía. ¡Crea uno con el botón de arriba!</div>`;
        return;
      }

      feed.innerHTML = items.map(item => {
        const fecha = new Date(item.created_at).toLocaleDateString([], {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const fotosHtml = (item.imagenes && item.imagenes.length > 0)
          ? `<div class="photo-grid">
              ${item.imagenes.map(url => `<img src="${url}" class="photo-thumb" onclick="openLightbox('${url}')" onerror="this.style.display='none'">`).join('')}
             </div>`
          : '';

        return `
          <div class="timeline-card">
            <div class="card-top">
              <div class="card-tags">
                <span class="badge-version">${item.version}</span>
                <span class="badge-phase">${item.fase || 'General'}</span>
              </div>
              <div class="card-controls">
                <span class="card-date">${fecha}</span>
                <button class="btn-delete" onclick="deleteReport('${item.id}')">🗑️ Eliminar</button>
              </div>
            </div>
            <div class="card-title">${item.resumen}</div>
            <div class="card-desc">${item.detalles || ''}</div>
            ${fotosHtml}
          </div>
        `;
      }).join('');
    }

    // ELIMINAR INFORME
    async function deleteReport(id) {
      const confirmar = confirm("¿Deseas eliminar este informe técnico definitivamente?");
      if (!confirmar) return;

      const { error } = await supabaseClient
        .from('changelog_updates')
        .delete()
        .eq('id', id);

      if (error) {
        alert("Error al eliminar: " + error.message + "\n(Verifica haber ejecutado la política de eliminación en Supabase)");
      } else {
        loadReports();
      }
    }

    // GESTIÓN DE ARRASTRE Y COMPRESIÓN DE IMÁGENES
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');

    dropzone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropzone.classList.add('dragover');
    });

    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'));

    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('dragover');
      handleFiles(e.dataTransfer.files);
    });

    fileInput.addEventListener('change', (e) => handleFiles(e.target.files));

    function handleFiles(files) {
      Array.from(files).forEach(file => {
        if (!file.type.startsWith('image/')) return;
        
        // Comprimir imagen localmente usando un canvas para subida rápida y fluida
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 1200;
            let width = img.width;
            let height = img.height;

            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }

            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            
            // Calidad optimizada WebP/JPEG
            const compressedData = canvas.toDataURL('image/jpeg', 0.75);
            uploadedImagesBase64.push(compressedData);
            renderPreviews();
          };
          img.src = event.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function renderPreviews() {
      const list = document.getElementById('preview-list');
      list.innerHTML = uploadedImagesBase64.map((data, index) => `
        <div class="preview-thumb-wrap">
          <img src="${data}" class="preview-thumb">
          <button class="remove-thumb" onclick="removeImage(${index})">✕</button>
        </div>
      `).join('');
    }

    function removeImage(index) {
      uploadedImagesBase64.splice(index, 1);
      renderPreviews();
    }

    // GUARDAR NUEVO REPORTE
    async function submitReport() {
      const version = document.getElementById('rep-version').value.trim();
      const fase = document.getElementById('rep-phase').value.trim() || 'General';
      const resumen = document.getElementById('rep-title').value.trim();
      const detalles = document.getElementById('rep-desc').value.trim();
      
      if (!version || !resumen) {
        alert("Indica la Versión y el Título del reporte.");
        return;
      }

      const saveBtn = document.getElementById('btn-save-report');
      saveBtn.innerText = "Publicando...";
      saveBtn.disabled = true;

      const { error } = await supabaseClient
        .from('changelog_updates')
        .insert([{
          version,
          fase,
          autor: 'Arquitecta',
          resumen,
          detalles,
          imagenes: uploadedImagesBase64
        }]);

      saveBtn.innerText = "Publicar al Instante";
      saveBtn.disabled = false;

      if (error) {
        alert("Error al publicar: " + error.message);
      } else {
        closeReportModal();
        document.getElementById('rep-version').value = '';
        document.getElementById('rep-phase').value = '';
        document.getElementById('rep-title').value = '';
        document.getElementById('rep-desc').value = '';
        uploadedImagesBase64 = [];
        renderPreviews();
        loadReports();
      }
    }

    // TIEMPO REAL
    function setupRealtime() {
      supabaseClient
        .channel('public:changelog_updates')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'changelog_updates' }, () => {
          loadReports();
        })
        .subscribe();
    }

    function openReportModal() { document.getElementById('report-modal').classList.add('open'); }
    function closeReportModal() { document.getElementById('report-modal').classList.remove('open'); }
    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

    window.addEventListener('DOMContentLoaded', () => {
      loadReports();
      setupRealtime();
    });
  </script>
</body>
</html>
