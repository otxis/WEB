<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Seguimiento de Obra — macOS Edition</title>
  
  <!-- Tipografía Inter y CDN de Supabase -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e2640 0%, #0d111a 100%);
      --window-bg: rgba(22, 27, 34, 0.75);
      --window-border: rgba(255, 255, 255, 0.12);
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover: rgba(255, 255, 255, 0.07);
      --text-main: #f0f6fc;
      --text-muted: #8b949e;
      --accent: #2f81f7;
      --accent-glow: rgba(47, 129, 247, 0.25);
      --tag-bg: rgba(56, 139, 253, 0.15);
      --tag-border: rgba(56, 139, 253, 0.35);
      --tag-text: #58a6ff;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* BARRA DE MENÚ SUPERIOR ESTILO macOS */
    .macos-menu-bar {
      height: 34px;
      background: rgba(13, 17, 23, 0.75);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-size: 13px;
      font-weight: 500;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .menu-left, .menu-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .apple-icon {
      font-size: 15px;
      cursor: pointer;
    }

    .menu-item {
      color: var(--text-muted);
      cursor: default;
    }
    .menu-item.active {
      color: var(--text-main);
      font-weight: 600;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 3px 8px;
      border-radius: 12px;
      background: rgba(46, 160, 67, 0.15);
      border: 1px solid rgba(46, 160, 67, 0.3);
      color: #3fb950;
      font-size: 11px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #3fb950;
      box-shadow: 0 0 8px #3fb950;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    /* CONTENEDOR PRINCIPAL / VENTANA MACOS */
    .desktop-container {
      flex: 1;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .window-frame {
      width: 100%;
      max-width: 900px;
      background: var(--window-bg);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--window-border);
      border-radius: 16px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
      overflow: hidden;
      animation: windowAppear 0.4s ease-out;
    }

    @keyframes windowAppear {
      from { opacity: 0; transform: scale(0.98) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* BARRA DE TÍTULO DE LA VENTANA (SEMÁFORO) */
    .window-header {
      height: 52px;
      background: rgba(255, 255, 255, 0.02);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
    }

    .traffic-lights {
      display: flex;
      gap: 8px;
      width: 70px;
    }
    .traffic-btn {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: none;
    }
    .traffic-close { background: #ff5f56; border: 1px solid #e0443e; }
    .traffic-min { background: #ffbd2e; border: 1px solid #dea123; }
    .traffic-max { background: #27c93f; border: 1px solid #1aab29; }

    .window-title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-macos {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text-main);
      font-size: 12px;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .btn-macos:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(255, 255, 255, 0.2);
    }
    .btn-primary {
      background: var(--accent);
      border-color: rgba(255, 255, 255, 0.2);
      color: white;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .btn-primary:hover {
      background: #388bfd;
    }

    /* CONTENIDO DEL CHANGELOG (LÍNEA DE TIEMPO) */
    .window-body {
      padding: 24px;
      max-height: calc(100vh - 160px);
      overflow-y: auto;
    }

    .timeline {
      position: relative;
      padding-left: 28px;
    }
    .timeline::before {
      content: '';
      position: absolute;
      top: 10px;
      bottom: 20px;
      left: 7px;
      width: 2px;
      background: rgba(255, 255, 255, 0.1);
    }

    .timeline-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 24px;
      backdrop-filter: blur(10px);
      transition: all 0.25s ease;
    }
    .timeline-card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.16);
      transform: translateY(-2px);
    }

    .timeline-node {
      position: absolute;
      left: -28px;
      top: 24px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #0d111a;
      border: 2px solid var(--accent);
      box-shadow: 0 0 8px var(--accent-glow);
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .badge-version {
      background: var(--tag-bg);
      color: var(--tag-text);
      border: 1px solid var(--tag-border);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      font-family: monospace;
    }
    .badge-phase {
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: #e6edf3;
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
    }
    .card-date {
      color: var(--text-muted);
      font-size: 12px;
      margin-left: auto;
    }

    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .card-desc {
      font-size: 14px;
      color: #c9d1d9;
      line-height: 1.6;
      white-space: pre-line;
      margin-bottom: 16px;
    }

    /* FOTOS EN CUADRÍCULA */
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    .photo-thumb {
      width: 100%;
      height: 110px;
      border-radius: 8px;
      object-fit: cover;
      cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: all 0.2s;
    }
    .photo-thumb:hover {
      transform: scale(1.03);
      border-color: var(--accent);
    }

    /* MODAL ESTILO MAC (NUEVO REPORTE) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 16px;
    }
    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      width: 100%;
      max-width: 540px;
      background: #161b22;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 30px 70px rgba(0, 0, 0, 0.8);
      animation: modalScale 0.25s ease-out;
    }
    @keyframes modalScale {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    .modal-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 500;
    }
    .form-input, .form-textarea {
      width: 100%;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      padding: 9px 12px;
      font-size: 13px;
      color: #fff;
      outline: none;
      font-family: inherit;
    }
    .form-input:focus, .form-textarea:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
    }

    /* VISOR LIGHTBOX PARA AMPLIAR FOTOS */
    .lightbox {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      backdrop-filter: blur(12px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 300;
      cursor: zoom-out;
    }
    .lightbox.open {
      display: flex;
    }
    .lightbox img {
      max-width: 90vw;
      max-height: 85vh;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    @media (max-width: 600px) {
      .window-header {
        flex-direction: column;
        height: auto;
        padding: 12px;
        gap: 10px;
      }
      .window-title { margin: 4px 0; }
      .timeline { padding-left: 20px; }
      .timeline-node { left: -22px; }
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR macOS -->
  <div class="macos-menu-bar">
    <div class="menu-left">
      <span class="apple-icon"></span>
      <span class="menu-item active">Portal Obra</span>
      <span class="menu-item">Versiones</span>
      <span class="menu-item">Fotos</span>
    </div>
    <div class="menu-right">
      <div class="status-badge" id="live-indicator">
        <span class="pulse-dot"></span>
        <span>En Vivo (Supabase)</span>
      </div>
      <span class="menu-item" id="macos-clock">12:00 PM</span>
    </div>
  </div>

  <!-- VENTANA PRINCIPAL -->
  <div class="desktop-container">
    <div class="window-frame">
      <div class="window-header">
        <div class="traffic-lights">
          <button class="traffic-btn traffic-close"></button>
          <button class="traffic-btn traffic-min"></button>
          <button class="traffic-btn traffic-max"></button>
        </div>
        <div class="window-title">
          <span>🏗️ Registro Diario de Obra — Changelog</span>
        </div>
        <div class="header-actions">
          <button class="btn-macos btn-primary" onclick="openReportModal()">+ Nuevo Informe</button>
        </div>
      </div>

      <div class="window-body">
        <div class="timeline" id="changelog-feed">
          <div style="text-align: center; padding: 40px; color: var(--text-muted);">
            Conectando con la base de datos...
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL PARA NUEVO REPORTE -->
  <div class="modal-overlay" id="report-modal">
    <div class="modal-box">
      <div class="modal-title">
        <span>Nueva Actualización de Obra</span>
        <button class="traffic-btn traffic-close" onclick="closeReportModal()"></button>
      </div>
      
      <div class="form-group">
        <label>Versión del Reporte (Ej: v1.0.4 o Día 12)</label>
        <input type="text" id="rep-version" class="form-input" placeholder="v1.0.4">
      </div>
      
      <div class="form-group">
        <label>Fase de Obra / Especialidad</label>
        <input type="text" id="rep-phase" class="form-input" placeholder="Estructuras, Fontanería, Acabados...">
      </div>

      <div class="form-group">
        <label>Título o Resumen Breve</label>
        <input type="text" id="rep-title" class="form-input" placeholder="Vaciado de losa y fraguado...">
      </div>

      <div class="form-group">
        <label>Detalle / Informe Técnico de la Arquitecta</label>
        <textarea id="rep-desc" class="form-textarea" rows="4" placeholder="Escribe aquí todas las observaciones técnicas..."></textarea>
      </div>

      <div class="form-group">
        <label>Enlaces de Fotos (separados por coma)</label>
        <input type="text" id="rep-photos" class="form-input" placeholder="https://ejemplo.com/foto1.jpg, https://ejemplo.com/foto2.jpg">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px;">
        <button class="btn-macos" onclick="closeReportModal()">Cancelar</button>
        <button class="btn-macos btn-primary" id="btn-save-report" onclick="submitReport()">Publicar al Instante</button>
      </div>
    </div>
  </div>

  <!-- VISOR DE FOTOS -->
  <div class="lightbox" id="lightbox" onclick="closeLightbox()">
    <img id="lightbox-img" src="" alt="Vista previa">
  </div>

  <script>
    // 1. CREDENCIALES INTEGRADAS DIRECTAMENTE DESDE TU PROYECTO
    const SUPABASE_URL = "https://euagegivizyfweymdiaa.supabase.co";
    const SUPABASE_ANON = "sb_publishable__O5ZZXX9L8Vp4JmAIT6vdQ_pUvVxaa5";

    let supabaseClient = null;

    // Inicializar cliente
    try {
      supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);
    } catch (err) {
      console.error("Error al conectar con Supabase:", err);
    }

    // Reloj superior
    function updateClock() {
      const now = new Date();
      document.getElementById('macos-clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // 2. CARGAR Y ESCUCHAR CAMBIOS EN TIEMPO REAL
    async function loadReports() {
      const feed = document.getElementById('changelog-feed');
      if (!supabaseClient) return;

      const { data, error } = await supabaseClient
        .from('changelog_updates')
        .select('*')
        .order('created_at', { ascending: false });

      if (error) {
        feed.innerHTML = `<div style="text-align:center; padding:30px; color:#ff6b6b;">Error al cargar datos: ${error.message}</div>`;
        return;
      }

      renderReports(data);
    }

    function renderReports(items) {
      const feed = document.getElementById('changelog-feed');
      if (!items || items.length === 0) {
        feed.innerHTML = `<div style="text-align:center; padding:40px; color:var(--text-muted);">Aún no hay reportes publicados. ¡Haz clic en "+ Nuevo Informe" para comenzar!</div>`;
        return;
      }

      feed.innerHTML = items.map(item => {
        const fecha = new Date(item.created_at).toLocaleDateString([], {
          month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
        });

        const fotosHtml = (item.imagenes && item.imagenes.length > 0)
          ? `<div class="photo-grid">
              ${item.imagenes.map(url => `<img src="${url.trim()}" class="photo-thumb" onclick="openLightbox('${url.trim()}')" onerror="this.style.display='none'">`).join('')}
             </div>`
          : '';

        return `
          <div class="timeline-card">
            <div class="timeline-node"></div>
            <div class="card-meta">
              <span class="badge-version">${item.version}</span>
              <span class="badge-phase">${item.fase || 'General'}</span>
              <span class="card-date">${fecha}</span>
            </div>
            <div class="card-title">${item.resumen}</div>
            <div class="card-desc">${item.detalles || ''}</div>
            ${fotosHtml}
          </div>
        `;
      }).join('');
    }

    // 3. ACTIVAR TIEMPO REAL (LISTENERS)
    function setupRealtime() {
      if (!supabaseClient) return;

      supabaseClient
        .channel('public:changelog_updates')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'changelog_updates' }, () => {
          loadReports(); // Se actualiza solo en todos los navegadores al haber un cambio
        })
        .subscribe();
    }

    // 4. GUARDAR NUEVO REPORTE
    async function submitReport() {
      const version = document.getElementById('rep-version').value.trim();
      const fase = document.getElementById('rep-phase').value.trim() || 'General';
      const resumen = document.getElementById('rep-title').value.trim();
      const detalles = document.getElementById('rep-desc').value.trim();
      const photosRaw = document.getElementById('rep-photos').value.trim();
      
      if (!version || !resumen) {
        alert("Por favor indica al menos la Versión y el Título del reporte.");
        return;
      }

      const imagenes = photosRaw ? photosRaw.split(',').map(s => s.trim()).filter(Boolean) : [];

      const saveBtn = document.getElementById('btn-save-report');
      saveBtn.innerText = "Publicando...";
      saveBtn.disabled = true;

      const { error } = await supabaseClient
        .from('changelog_updates')
        .insert([{
          version,
          fase,
          autor: 'Arquitecta',
          resumen,
          detalles,
          imagenes
        }]);

      saveBtn.innerText = "Publicar al Instante";
      saveBtn.disabled = false;

      if (error) {
        alert("Error al guardar: " + error.message);
      } else {
        closeReportModal();
        // Limpiar campos
        document.getElementById('rep-version').value = '';
        document.getElementById('rep-phase').value = '';
        document.getElementById('rep-title').value = '';
        document.getElementById('rep-desc').value = '';
        document.getElementById('rep-photos').value = '';
        loadReports();
      }
    }

    // Modales y Visor
    function openReportModal() { document.getElementById('report-modal').classList.add('open'); }
    function closeReportModal() { document.getElementById('report-modal').classList.remove('open'); }
    function openLightbox(url) {
      document.getElementById('lightbox-img').src = url;
      document.getElementById('lightbox').classList.add('open');
    }
    function closeLightbox() { document.getElementById('lightbox').classList.remove('open'); }

    // Arrancar aplicación
    window.addEventListener('DOMContentLoaded', () => {
      loadReports();
      setupRealtime();
    });
  </script>
</body>
</html>
